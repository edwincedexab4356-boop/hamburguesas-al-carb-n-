<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C78A" />
      <stop offset="50%" stop-color="#C7A66A" />
      <stop offset="100%" stop-color="#9A7638" />
    </linearGradient>
  </defs>
  
  <!-- Emblem: Fire & Charcoal Crest -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
    <circle cx="50" cy="50" r="42" fill="#141414" stroke="url(#goldGrad)" stroke-width="1.8"/>
    
    <!-- Stylized Grill & Flame Marks -->
    <path d="M30 65 L70 65 M34 57 L66 57 M40 49 L60 49" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Rising Flame Motif -->
    <path d="M50 24 C54 32, 60 36, 56 46 C53 40, 50 42, 48 38 C46 42, 42 41, 44 47 C39 42, 44 32, 50 24 Z" fill="url(#goldGrad)"/>
    
    <!-- Small star accents -->
    <polygon points="50,15 51.5,18 55,18.5 52.5,21 53,24.5 50,23 47,24.5 47.5,21 45,18.5 48.5,18" fill="#C7A66A" opacity="0.8"/>
  </g>

  <!-- Typography Brand -->
  <text x="135" y="52" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#goldGrad)">
    HAMBURGUESAS
  </text>
  <text x="136" y="82" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="22" font-weight="600" letter-spacing="8" fill="#F5F0E8">
    AL CARBÓN
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="137" y="102" font-family="'Manrope', sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#A39D93">
    HAUTE GASTRONOMIE · BRASAS &amp; AUTOR
  </text>
  
  <!-- Subtle divider line -->
  <line x1="135" y1="89" x2="460" y2="89" stroke="url(#goldGrad)" stroke-width="0.75" opacity="0.4"/>
</svg>
